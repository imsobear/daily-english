name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run at a time per branch. A superseded pull request run is worth nothing,
# but two deploys racing to the same Worker are worth less than nothing: the
# loser is what stays live.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The parent commit, so the deploy step can see what changed.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # Shipping, and only because everything above passed. Fenced to this
      # repository so a fork checks the code and stops there, and quiet about it
      # when no token is configured. Migrations go first, so the new code never
      # meets a schema missing its columns. The build is still on disk, so the
      # upload does not repeat it.
      #
      # A commit that only touched prose does not need a Worker. The test is
      # deliberately one-sided: it skips only when every changed path is one we
      # know the Worker never serves, so an unfamiliar path — or no answer at
      # all from git — deploys. `public/` is not on that list; those files are
      # served.
      - name: Deploy
        id: deploy
        if: github.ref == 'refs/heads/main' && github.repository == 'imsobear/daily-english'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # An identifier rather than a credential, and useless without one.
          CLOUDFLARE_ACCOUNT_ID: 0c8c9a41f55c7f43aafb16c63932e723
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set, so nothing was deployed."
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD || true)
          if ! echo "$changed" | grep -qvE '^(docs/|[^/]*\.md$|LICENSE$)'; then
            echo "Prose only, so the Worker stays as it is:"
            echo "$changed"
            exit 0
          fi
          pnpm exec wrangler d1 migrations apply english-lessons --remote
          pnpm exec wrangler deploy | tee /tmp/deploy.log
          # What the mail below reports, and what a rollback would undo.
          {
            echo "shipped=true"
            echo "version=$(sed -n 's/^Current Version ID: //p' /tmp/deploy.log | tail -1)"
          } >> "$GITHUB_OUTPUT"

      # A line in the inbox whenever production moves, or fails to. Sent by the
      # same Cloudflare account that just deployed, from a domain onboarded to
      # Email Sending, so nothing here depends on a third party. A merge that
      # only touched prose says nothing, because nothing happened; a run that
      # fell over before the deploy says so, since silence would read as
      # success. Mail that will not send is reported and forgiven — a deploy
      # that worked did not stop working because the news about it got lost.
      - name: Email the result
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          github.repository == 'imsobear/daily-english' &&
          (steps.deploy.outputs.shipped == 'true' || job.status == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c8c9a41f55c7f43aafb16c63932e723
          TO: ${{ secrets.DEPLOY_EMAIL_TO }}
          SHIPPED: ${{ steps.deploy.outputs.shipped }}
          VERSION: ${{ steps.deploy.outputs.version }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TO" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No recipient or no token, so no mail."
            exit 0
          fi

          title=$(printf '%s' "$MESSAGE" | head -1)
          if [ "$SHIPPED" = "true" ]; then
            subject="Deployed: $title"
            body=$(printf '%s\n\nLive at https://english.readish.app\nCommit %s\nVersion %s\n\nRun: %s\n\nTo put the previous version back:\n  pnpm exec wrangler rollback\n' \
              "$MESSAGE" "$GITHUB_SHA" "${VERSION:-unknown}" "$RUN")
          else
            subject="Deploy failed: $title"
            body=$(printf '%s\n\nNothing was deployed; production is untouched.\nCommit %s\n\nRun: %s\n' \
              "$MESSAGE" "$GITHUB_SHA" "$RUN")
          fi

          # Through jq rather than a here-doc: a commit message is arbitrary
          # text, and quoting it by hand is how you send broken JSON one day.
          jq -n --arg to "$TO" --arg subject "$subject" --arg text "$body" '{
            to: $to,
            from: { address: "deploys@readish.app", name: "Daily English" },
            subject: $subject,
            text: $text
          }' > /tmp/mail.json

          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/email/sending/send" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/mail.json ||
            echo "The mail did not go out. The deploy above is unaffected."
