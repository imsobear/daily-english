name: CI

on:
  push:
    branches: [main]
  pull_request:

# An account identifier rather than a credential: it says which account to
# deploy to, and grants nothing without the token.
env:
  CLOUDFLARE_ACCOUNT_ID: 0c8c9a41f55c7f43aafb16c63932e723

jobs:
  ci:
    runs-on: ubuntu-latest
    # A second push waits for the first to finish rather than racing it to the
    # same Worker.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Whether a deploy is possible at all. A fork, or this repository before
      # the token was added, checks the code and stops there. The token itself
      # is passed only to the steps that need it, so an install script cannot
      # read it. `secrets` cannot be named in an `if`, hence going through here.
      DEPLOYABLE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # Shipping starts here, and only because everything above passed.
      - name: Apply pending migrations
        if: |
          github.ref == 'refs/heads/main'
          && github.repository == 'imsobear/daily-english'
          && env.DEPLOYABLE == 'true'
        run: pnpm exec wrangler d1 migrations apply english-lessons --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The build above is still on disk, so this uploads it rather than
      # repeating it.
      - name: Deploy
        if: |
          github.ref == 'refs/heads/main'
          && github.repository == 'imsobear/daily-english'
          && env.DEPLOYABLE == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
