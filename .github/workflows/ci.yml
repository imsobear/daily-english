name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # Shipping, and only because everything above passed. Fenced to this
      # repository so a fork checks the code and stops there, and quiet about
      # it when no token is configured. Migrations go first, so the new code
      # never meets a schema missing its columns. The build is still on disk,
      # so the upload does not repeat it.
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.repository == 'imsobear/daily-english'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # An identifier rather than a credential, and useless without one.
          CLOUDFLARE_ACCOUNT_ID: 0c8c9a41f55c7f43aafb16c63932e723
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set, so nothing was deployed."
            exit 0
          fi
          pnpm exec wrangler d1 migrations apply english-lessons --remote
          pnpm exec wrangler deploy
