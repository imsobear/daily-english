<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daily English">
  <!--
    Source of truth for every app icon and launch screen; scripts/icons.mjs
    rasterises this file. Full bleed with no rounded corners of its own, because
    iOS and Android launchers apply their own mask. The glyph is kept inside the
    central 80% so a maskable crop never clips it.
  -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d" />
      <stop offset="1" stop-color="#ea5808" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#warm)" />
  <g transform="translate(256 264) scale(.88) translate(-256 -256)" fill="#fff8f2">
    <path d="M96 150C150 118 205 122 246 148v226c-41-26-96-30-150 2z" />
    <path d="M416 150c-54-32-109-28-150-2v226c41-26 96-30 150 2z" />
  </g>
</svg>
